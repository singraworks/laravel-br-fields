name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [lowest, highest]
        include:
          - laravel: '12'
            testbench: '^10.12'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Pin Laravel ${{ matrix.laravel }}
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: composer require --dev --no-interaction --no-update "laravel/framework:^${LARAVEL}.0" "orchestra/testbench:${TESTBENCH}"

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run checks
        run: composer ci:check
